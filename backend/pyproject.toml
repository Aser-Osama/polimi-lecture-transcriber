[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polimi-transcriber-backend"
version = "0.1.0"
description = "Local lecture transcription backend (FastAPI + MLX Whisper)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "mlx-whisper>=0.4.2",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter, not by the linter
    "UP042",  # str-based enums are intentional for JSON/DB values
]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # FastAPI dependency defaults call File()/Request()

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
